name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod/ocwo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (common + Fabric)
        run: |
          chmod +x gradlew
          ./gradlew :common:build :fabric:build :fabric:compileGametestJava --no-daemon --console=plain
      - name: Check mixin targets against Minecraft 26.3
        run: |
          JAR=common/build/moddev/artifacts/vanilla-26.3-1-merged.jar
          python3 ../../tools/ci/checkmixins.py common/src/main/java "$JAR" "$JAVA_HOME/bin/javap"
          python3 ../../tools/ci/checkinject.py common/src/main/java "$JAR" "$JAVA_HOME/bin/javap"
      - uses: actions/upload-artifact@v4
        with:
          name: ocwo-fabric
          path: mod/ocwo/fabric/build/libs/*.jar
# Game tests are not run here: they start a Minecraft server, whose EULA was accepted
# by the project owner for the local test server only.
