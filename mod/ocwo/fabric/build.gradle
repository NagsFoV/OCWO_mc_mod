plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
            // diagnostics, for example -Docwo.serverArgs=-Docwo.traceWake=5000
            vmArg System.getProperty('ocwo.serverArgs', '-Docwo.none=1')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

// OCWO automated game tests (headless server): ./gradlew :fabric:runGameTest
// The test server needs the Minecraft EULA to be accepted (eula = true) by the project owner.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "ocwo-gametest"
        enableGameTests = true
        enableClientGameTests = false
        eula = true // accepted by the project owner (Valentin) on 2026-11-12, test server only
    }
}

// Regular game tests only (pressure scenarios): ./gradlew :fabric:runGameTest
// Performance scenarios, separately: ./gradlew :fabric:runGameTestPerf
afterEvaluate {
    loom.runs.named('gameTest') {
        vmArg '-Dfabric-api.gametest.filter=ocwo-gametest:check_*'
    }
}
loom {
    runs {
        gameTestPerf {
            server()
            name = 'Game Test (performance)'
            source sourceSets.gametest
            runDir 'build/run/gameTestPerf'
            ideConfigGenerated false
            vmArg '-Dfabric-api.gametest'
            vmArg System.getProperty("ocwo.perf", "-Dfabric-api.gametest.filter=ocwo-gametest:performance_*")
        }
    }
}

// Dev tool: dumps every block of the game (for the OCWO material classification): ./gradlew :fabric:runBlockDump
loom {
    runs {
        blockDump {
            server()
            name = 'Block dump'
            source sourceSets.gametest
            runDir 'build/run/blockDump'
            ideConfigGenerated false
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.filter=ocwo-gametest:tools_*'
            vmArg "-Docwo.dump=${rootProject.file('../../tools/blocks-26.3-raw.json').absolutePath.replace(File.separator, '/')}"
        }
    }
}

// Game tests start a Minecraft server: they only run when asked for by name (:fabric:runGameTest...),
// never as part of build/check (nor in CI, where the Minecraft EULA has not been accepted).
gradle.taskGraph.whenReady { graph ->
    def asked = gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }
    if (!asked) {
        graph.allTasks.findAll { it.name == 'runGameTest' }.each { it.enabled = false }
    }
}

// Cost of the world generation, on real terrain (normal world, seed 0): ./gradlew :fabric:runGameTestGeneration
// To compare without OCWO, set fluidPhysicsEnabled to false in build/run/gameTestGeneration/config/ocwo/boot.jsonc.
// Delete build/run/gameTestGeneration/world before each run: the chunks must be generated, not read from the disk.
loom {
    runs {
        gameTestGeneration {
            server()
            name = 'Game Test (generation)'
            source sourceSets.gametest
            runDir 'build/run/gameTestGeneration'
            ideConfigGenerated false
            vmArg '-Dfabric-api.gametest'
            vmArg '-Docwo.terrain=true'
            vmArg '-Dfabric-api.gametest.filter=ocwo-gametest:generation_*'
        }
    }
}

// Series of communicating vessels (each case alone in its batch): ./gradlew :fabric:runGameTestVessels
loom {
    runs {
        gameTestVessels {
            server()
            name = 'Game Test (vessels)'
            source sourceSets.gametest
            runDir 'build/run/gameTestVessels'
            ideConfigGenerated false
            vmArg '-Dfabric-api.gametest'
            vmArg System.getProperty("ocwo.vessels", "-Dfabric-api.gametest.filter=ocwo-gametest:vessels_*")
        }
    }
}
